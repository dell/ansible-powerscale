---
# Example: Multi-ACE with container_inherit + inherit_only
#
# This playbook demonstrates configuring two ACEs for the same trustee
# where one ACE uses container_inherit + inherit_only (permissions are
# inherited by subdirectories but do NOT apply to the parent directory
# itself).
#
# Use case: An administrator needs the trustee to have full control on
# the parent directory via one ACE, and a separate inherit-only ACE that
# propagates read permissions to child directories without affecting the
# parent.

- name: Multi-ACE filesystem operations - container_inherit + inherit_only
  hosts: localhost
  connection: local
  vars:
    onefs_host: '10.**.**.**'
    verify_ssl: false
    api_user: 'root'
    api_password: '**********'
    test_path: '/ifs/multi_ace_container_inherit_only_test'
    trustee_user: 'ansible_test_user1'
    trustee_provider: 'ldap'

  tasks:
    - name: Create filesystem for container_inherit + inherit_only multi-ACE test
      dellemc.powerscale.filesystem:
        onefs_host: "{{ onefs_host }}"
        verify_ssl: "{{ verify_ssl }}"
        api_user: "{{ api_user }}"
        api_password: "{{ api_password }}"
        path: "{{ test_path }}"
        owner:
          name: "{{ trustee_user }}"
          provider_type: "{{ trustee_provider }}"
        state: present

    - name: Set two ACEs with container_inherit + inherit_only for the same trustee
      dellemc.powerscale.filesystem:
        onefs_host: "{{ onefs_host }}"
        verify_ssl: "{{ verify_ssl }}"
        api_user: "{{ api_user }}"
        api_password: "{{ api_password }}"
        path: "{{ test_path }}"
        access_control_rights:
          # ACE 1: Full control applied to the directory itself (no inheritance)
          - access_type: "allow"
            access_rights:
              - "dir_gen_all"
            inherit_flags: []
            trustee:
              name: "{{ trustee_user }}"
              provider_type: "{{ trustee_provider }}"
          # ACE 2: Read access inherited by subdirectories only (not applied here)
          - access_type: "allow"
            access_rights:
              - "dir_gen_read"
            inherit_flags:
              - "container_inherit"
              - "inherit_only"
            trustee:
              name: "{{ trustee_user }}"
              provider_type: "{{ trustee_provider }}"
        access_control_rights_state: "replace"
        state: present

    - name: Set two ACEs with container_inherit + inherit_only - Idempotency check
      dellemc.powerscale.filesystem:
        onefs_host: "{{ onefs_host }}"
        verify_ssl: "{{ verify_ssl }}"
        api_user: "{{ api_user }}"
        api_password: "{{ api_password }}"
        path: "{{ test_path }}"
        access_control_rights:
          - access_type: "allow"
            access_rights:
              - "dir_gen_all"
            inherit_flags: []
            trustee:
              name: "{{ trustee_user }}"
              provider_type: "{{ trustee_provider }}"
          - access_type: "allow"
            access_rights:
              - "dir_gen_read"
            inherit_flags:
              - "container_inherit"
              - "inherit_only"
            trustee:
              name: "{{ trustee_user }}"
              provider_type: "{{ trustee_provider }}"
        access_control_rights_state: "replace"
        state: present
      register: result_idempotent

    - name: Verify idempotency (no changes expected)
      ansible.builtin.assert:
        that:
          - not result_idempotent.changed
        fail_msg: "Idempotency check failed - unexpected change detected"

    - name: Clean up - delete test filesystem
      dellemc.powerscale.filesystem:
        onefs_host: "{{ onefs_host }}"
        verify_ssl: "{{ verify_ssl }}"
        api_user: "{{ api_user }}"
        api_password: "{{ api_password }}"
        path: "{{ test_path }}"
        recursive_force_delete: true
        state: absent

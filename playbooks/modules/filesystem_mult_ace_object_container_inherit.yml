---
# Example: Multi-trustee ACL with object_inherit + container_inherit (full inheritance)
#
# This playbook demonstrates configuring ACEs for multiple trustees with
# full inheritance (object_inherit + container_inherit), which propagates
# permissions to both files and subdirectories.
#
# Use case: An administrator needs to set up a shared directory where an
# admin user gets full control and a read-only user gets read access, with
# both sets of permissions propagating to all child objects.
#
# NOTE: The OneFS REST API consolidates multiple ACEs for the same trustee
# with the same access_type into a single ACE. Use different trustees or
# different access_type values (allow + deny) to maintain separate ACEs.

- name: Multi-trustee ACL with full inheritance (OI + CI)
  hosts: localhost
  connection: local
  vars:
    onefs_host: '10.**.**.**'
    verify_ssl: false
    api_user: 'root'
    api_password: '**********'
    test_path: '/ifs/multi_ace_object_container_inherit_test'
    admin_user: 'ansible_test_user1'
    read_user: 'ansible_test_user2'
    trustee_provider: 'ldap'

  tasks:
    - name: Create filesystem for full-inheritance multi-trustee test
      dellemc.powerscale.filesystem:
        onefs_host: "{{ onefs_host }}"
        verify_ssl: "{{ verify_ssl }}"
        api_user: "{{ api_user }}"
        api_password: "{{ api_password }}"
        path: "{{ test_path }}"
        owner:
          name: "{{ admin_user }}"
          provider_type: "{{ trustee_provider }}"
        state: present

    - name: Set ACEs for two trustees with full inheritance
      dellemc.powerscale.filesystem:
        onefs_host: "{{ onefs_host }}"
        verify_ssl: "{{ verify_ssl }}"
        api_user: "{{ api_user }}"
        api_password: "{{ api_password }}"
        path: "{{ test_path }}"
        access_control_rights:
          # Admin: full control propagated to files and subdirectories
          - access_type: "allow"
            access_rights:
              - "dir_gen_all"
            inherit_flags:
              - "object_inherit"
              - "container_inherit"
            trustee:
              name: "{{ admin_user }}"
              provider_type: "{{ trustee_provider }}"
          # Read user: read access propagated to files and subdirectories
          - access_type: "allow"
            access_rights:
              - "dir_gen_read"
            inherit_flags:
              - "object_inherit"
              - "container_inherit"
            trustee:
              name: "{{ read_user }}"
              provider_type: "{{ trustee_provider }}"
        access_control_rights_state: "replace"
        state: present

    - name: Set ACEs for two trustees with full inheritance - Idempotency check
      dellemc.powerscale.filesystem:
        onefs_host: "{{ onefs_host }}"
        verify_ssl: "{{ verify_ssl }}"
        api_user: "{{ api_user }}"
        api_password: "{{ api_password }}"
        path: "{{ test_path }}"
        access_control_rights:
          - access_type: "allow"
            access_rights:
              - "dir_gen_all"
            inherit_flags:
              - "object_inherit"
              - "container_inherit"
            trustee:
              name: "{{ admin_user }}"
              provider_type: "{{ trustee_provider }}"
          - access_type: "allow"
            access_rights:
              - "dir_gen_read"
            inherit_flags:
              - "object_inherit"
              - "container_inherit"
            trustee:
              name: "{{ read_user }}"
              provider_type: "{{ trustee_provider }}"
        access_control_rights_state: "replace"
        state: present
      register: result_idempotent

    - name: Verify idempotency (no changes expected)
      ansible.builtin.assert:
        that:
          - not result_idempotent.changed
        fail_msg: "Idempotency check failed - unexpected change detected"

    - name: Clean up - delete test filesystem
      dellemc.powerscale.filesystem:
        onefs_host: "{{ onefs_host }}"
        verify_ssl: "{{ verify_ssl }}"
        api_user: "{{ api_user }}"
        api_password: "{{ api_password }}"
        path: "{{ test_path }}"
        recursive_force_delete: true
        state: absent

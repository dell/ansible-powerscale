---
- name: Group Module Operations on PowerScale
  hosts: localhost
  connection: local
  vars:
    onefs_host: '10.**.**.**'
    port_no: '8080'
    verify_ssl: false
    api_user: 'user'
    api_password: '**********'
    group_name: 'test_group_1'
    access_zone: "System"
    provider_type: "local"
    user_name_1: "test_user_1"
    user_name_2: "test_user_2"
    empty_group_name: "sample_empty_group"
    ldap_user_name: "ldap_user"
    ldap_group_name: "ldap_group"

  tasks:
    - name: Create Empty Group
      dellemc.powerscale.group:
        onefs_host: "{{ onefs_host }}"
        api_user: "{{ api_user }}"
        api_password: "{{ api_password }}"
        verify_ssl: "{{ verify_ssl }}"
        provider_type: "{{ provider_type }}"
        access_zone: "{{ access_zone }}"
        group_name: "{{ empty_group_name }}"
        group_id: 1000
        state: "present"

    - name: Create Empty Group Idempotency check
      dellemc.powerscale.group:
        onefs_host: "{{ onefs_host }}"
        api_user: "{{ api_user }}"
        api_password: "{{ api_password }}"
        verify_ssl: "{{ verify_ssl }}"
        provider_type: "{{ provider_type }}"
        access_zone: "{{ access_zone }}"
        group_name: "{{ empty_group_name }}"
        group_id: 1000
        state: "present"

    - name: Create Group with Users
      register: result
      dellemc.powerscale.group:
        onefs_host: "{{ onefs_host }}"
        api_user: "{{ api_user }}"
        api_password: "{{ api_password }}"
        verify_ssl: "{{ verify_ssl }}"
        provider_type: "{{ provider_type }}"
        access_zone: "{{ access_zone }}"
        group_name: "{{ group_name }}"
        users:
          - user_name: "{{ user_name_1 }}"
          - user_name: "{{ user_name_2 }}"
        user_state: "present-in-group"
        state: "present"

    - name: Create Group with Users Idempotency check
      register: result
      dellemc.powerscale.group:
        onefs_host: "{{ onefs_host }}"
        api_user: "{{ api_user }}"
        api_password: "{{ api_password }}"
        verify_ssl: "{{ verify_ssl }}"
        provider_type: "{{ provider_type }}"
        access_zone: "{{ access_zone }}"
        group_name: "{{ group_name }}"
        users:
          - user_name: "{{ user_name_1 }}"
          - user_name: "{{ user_name_2 }}"
        user_state: "present-in-group"
        state: "present"

    - name: Setting group id - {{ result.group_details.gid.id }}
      ansible.legacy.set_fact:
        group_id: "{{ result.group_details.gid.id.split(':')[1] }}"

    - name: Fetch user_id using user_name {{ user_name_1 }}
      register: result
      dellemc.powerscale.user:
        onefs_host: "{{ onefs_host }}"
        port_no: "{{ port_no }}"
        api_user: "{{ api_user }}"
        api_password: "{{ api_password }}"
        verify_ssl: "{{ verify_ssl }}"
        access_zone: "{{ access_zone }}"
        provider_type: "{{ provider_type }}"
        user_name: "{{ user_name_1 }}"
        state: "present"

    - name: Setting user id for {{ user_name_1 }}
      ansible.legacy.set_fact:
        user_id_1: "{{ result.user_details.uid.id.split(':')[1] }}"

    - name: Fetch user_id using user_name {{ user_name_2 }}
      register: result
      dellemc.powerscale.user:
        onefs_host: "{{ onefs_host }}"
        port_no: "{{ port_no }}"
        api_user: "{{ api_user }}"
        api_password: "{{ api_password }}"
        verify_ssl: "{{ verify_ssl }}"
        access_zone: "{{ access_zone }}"
        provider_type: "{{ provider_type }}"
        user_name: "{{ user_name_2 }}"
        state: "present"

    - name: Setting user id for {{ user_name_2 }}
      ansible.legacy.set_fact:
        user_id_2: "{{ result.user_details.uid.id.split(':')[1] }}"

    - name: Change the primary group of the user
      dellemc.powerscale.user:
        onefs_host: "{{ onefs_host }}"
        port_no: "{{ port_no }}"
        api_user: "{{ api_user }}"
        api_password: "{{ api_password }}"
        verify_ssl: "{{ verify_ssl }}"
        access_zone: "{{ access_zone }}"
        provider_type: "{{ provider_type }}"
        user_name: "{{ user_name_2 }}"
        primary_group: "{{ group_name }}"
        state: "present"

    - name: Change the primary group of the user idempotency check
      dellemc.powerscale.user:
        onefs_host: "{{ onefs_host }}"
        port_no: "{{ port_no }}"
        api_user: "{{ api_user }}"
        api_password: "{{ api_password }}"
        verify_ssl: "{{ verify_ssl }}"
        access_zone: "{{ access_zone }}"
        provider_type: "{{ provider_type }}"
        user_name: "{{ user_name_2 }}"
        primary_group: "{{ group_name }}"
        state: "present"

    - name: Get Details of the Group using Group Id
      dellemc.powerscale.group:
        onefs_host: "{{ onefs_host }}"
        api_user: "{{ api_user }}"
        api_password: "{{ api_password }}"
        verify_ssl: "{{ verify_ssl }}"
        provider_type: "{{ provider_type }}"
        access_zone: "{{ access_zone }}"
        group_id: 1000
        state: "present"

    - name: Remove Users from a Group
      dellemc.powerscale.group:
        onefs_host: "{{ onefs_host }}"
        api_user: "{{ api_user }}"
        api_password: "{{ api_password }}"
        verify_ssl: "{{ verify_ssl }}"
        provider_type: "{{ provider_type }}"
        access_zone: "{{ access_zone }}"
        group_id: "{{ group_id }}"
        users:
          - user_id: "{{ user_id_2 }}"
          - user_id: "{{ user_id_1 }}"
        user_state: "absent-in-group"
        state: "present"

    - name: Remove Users from a Group Idempotency check
      dellemc.powerscale.group:
        onefs_host: "{{ onefs_host }}"
        api_user: "{{ api_user }}"
        api_password: "{{ api_password }}"
        verify_ssl: "{{ verify_ssl }}"
        provider_type: "{{ provider_type }}"
        access_zone: "{{ access_zone }}"
        group_id: "{{ group_id }}"
        users:
          - user_id: "{{ user_id_2 }}"
          - user_id: "{{ user_id_1 }}"
        user_state: "absent-in-group"
        state: "present"

    - name: Add Users to a Group
      dellemc.powerscale.group:
        onefs_host: "{{ onefs_host }}"
        api_user: "{{ api_user }}"
        api_password: "{{ api_password }}"
        verify_ssl: "{{ verify_ssl }}"
        provider_type: "{{ provider_type }}"
        access_zone: "{{ access_zone }}"
        group_id: "{{ group_id }}"
        users:
          - user_name: "{{ user_name_1 }}"
          - user_name: "{{ user_name_2 }}"
        user_state: "present-in-group"
        state: "present"

    - name: Add Users to a Group Idempotency check
      dellemc.powerscale.group:
        onefs_host: "{{ onefs_host }}"
        api_user: "{{ api_user }}"
        api_password: "{{ api_password }}"
        verify_ssl: "{{ verify_ssl }}"
        provider_type: "{{ provider_type }}"
        access_zone: "{{ access_zone }}"
        group_id: "{{ group_id }}"
        users:
          - user_name: "{{ user_name_1 }}"
          - user_name: "{{ user_name_2 }}"
        user_state: "present-in-group"
        state: "present"

    - name: Add Users to Empty Group
      dellemc.powerscale.group:
        onefs_host: "{{ onefs_host }}"
        api_user: "{{ api_user }}"
        api_password: "{{ api_password }}"
        verify_ssl: "{{ verify_ssl }}"
        provider_type: "{{ provider_type }}"
        access_zone: "{{ access_zone }}"
        group_name: "{{ empty_group_name }}"
        users:
          - user_name: "{{ user_name_1 }}"
          - user_name: "{{ user_name_2 }}"
        user_state: "present-in-group"
        state: "present"

    - name: Add Users to Empty Group Idempotency check
      dellemc.powerscale.group:
        onefs_host: "{{ onefs_host }}"
        api_user: "{{ api_user }}"
        api_password: "{{ api_password }}"
        verify_ssl: "{{ verify_ssl }}"
        provider_type: "{{ provider_type }}"
        access_zone: "{{ access_zone }}"
        group_name: "{{ empty_group_name }}"
        users:
          - user_name: "{{ user_name_1 }}"
          - user_name: "{{ user_name_2 }}"
        user_state: "present-in-group"
        state: "present"

    - name: Delete the Group using Group Name
      dellemc.powerscale.group:
        onefs_host: "{{ onefs_host }}"
        api_user: "{{ api_user }}"
        api_password: "{{ api_password }}"
        verify_ssl: "{{ verify_ssl }}"
        provider_type: "{{ provider_type }}"
        access_zone: "{{ access_zone }}"
        group_name: "{{ group_name }}"
        state: "absent"

    - name: Delete the Group using Group Name Idempotency check
      dellemc.powerscale.group:
        onefs_host: "{{ onefs_host }}"
        api_user: "{{ api_user }}"
        api_password: "{{ api_password }}"
        verify_ssl: "{{ verify_ssl }}"
        provider_type: "{{ provider_type }}"
        access_zone: "{{ access_zone }}"
        group_name: "{{ group_name }}"
        state: "absent"

    - name: Delete Empty Group
      dellemc.powerscale.group:
        onefs_host: "{{ onefs_host }}"
        api_user: "{{ api_user }}"
        api_password: "{{ api_password }}"
        verify_ssl: "{{ verify_ssl }}"
        provider_type: "{{ provider_type }}"
        access_zone: "{{ access_zone }}"
        group_name: "{{ empty_group_name }}"
        state: "absent"

    # ----------------------------------------------------------------
    # Cross-provider group membership tasks
    # ----------------------------------------------------------------

    - name: Re-create Group for cross-provider tests
      dellemc.powerscale.group:
        onefs_host: "{{ onefs_host }}"
        api_user: "{{ api_user }}"
        api_password: "{{ api_password }}"
        verify_ssl: "{{ verify_ssl }}"
        provider_type: "{{ provider_type }}"
        access_zone: "{{ access_zone }}"
        group_name: "{{ group_name }}"
        state: "present"

    - name: Add an LDAP user to a local group (cross-provider)
      dellemc.powerscale.group:
        onefs_host: "{{ onefs_host }}"
        api_user: "{{ api_user }}"
        api_password: "{{ api_password }}"
        verify_ssl: "{{ verify_ssl }}"
        provider_type: "local"
        access_zone: "{{ access_zone }}"
        group_name: "{{ group_name }}"
        users:
          - user_name: "{{ ldap_user_name }}"
            provider_type: "ldap"
        user_state: "present-in-group"
        state: "present"

    - name: Add an LDAP user to a local group - Idempotency check
      dellemc.powerscale.group:
        onefs_host: "{{ onefs_host }}"
        api_user: "{{ api_user }}"
        api_password: "{{ api_password }}"
        verify_ssl: "{{ verify_ssl }}"
        provider_type: "local"
        access_zone: "{{ access_zone }}"
        group_name: "{{ group_name }}"
        users:
          - user_name: "{{ ldap_user_name }}"
            provider_type: "ldap"
        user_state: "present-in-group"
        state: "present"

    - name: Add mixed-provider members in a single task
      dellemc.powerscale.group:
        onefs_host: "{{ onefs_host }}"
        api_user: "{{ api_user }}"
        api_password: "{{ api_password }}"
        verify_ssl: "{{ verify_ssl }}"
        provider_type: "local"
        access_zone: "{{ access_zone }}"
        group_name: "{{ group_name }}"
        users:
          - user_name: "{{ user_name_1 }}"
          - user_name: "{{ ldap_user_name }}"
            provider_type: "ldap"
        user_state: "present-in-group"
        state: "present"

    - name: Remove an LDAP user from a local group
      dellemc.powerscale.group:
        onefs_host: "{{ onefs_host }}"
        api_user: "{{ api_user }}"
        api_password: "{{ api_password }}"
        verify_ssl: "{{ verify_ssl }}"
        provider_type: "local"
        access_zone: "{{ access_zone }}"
        group_name: "{{ group_name }}"
        users:
          - user_name: "{{ ldap_user_name }}"
            provider_type: "ldap"
        user_state: "absent-in-group"
        state: "present"

    - name: Check mode with diff - preview cross-provider changes
      dellemc.powerscale.group:
        onefs_host: "{{ onefs_host }}"
        api_user: "{{ api_user }}"
        api_password: "{{ api_password }}"
        verify_ssl: "{{ verify_ssl }}"
        provider_type: "local"
        access_zone: "{{ access_zone }}"
        group_name: "{{ group_name }}"
        users:
          - user_name: "{{ ldap_user_name }}"
            provider_type: "ldap"
        user_state: "present-in-group"
        state: "present"
      check_mode: true
      diff: true
      register: result

    - name: Display diff output
      ansible.builtin.debug:
        var: result.diff

    - name: Cleanup cross-provider test group
      dellemc.powerscale.group:
        onefs_host: "{{ onefs_host }}"
        api_user: "{{ api_user }}"
        api_password: "{{ api_password }}"
        verify_ssl: "{{ verify_ssl }}"
        provider_type: "{{ provider_type }}"
        access_zone: "{{ access_zone }}"
        group_name: "{{ group_name }}"
        state: "absent"

    # ----------------------------------------------------------------
    # End cross-provider tasks
    # ----------------------------------------------------------------

    # ----------------------------------------------------------------
    # Child group membership tasks (group_members parameter)
    # ----------------------------------------------------------------

    - name: Re-create Group for child group membership tests
      dellemc.powerscale.group:
        onefs_host: "{{ onefs_host }}"
        api_user: "{{ api_user }}"
        api_password: "{{ api_password }}"
        verify_ssl: "{{ verify_ssl }}"
        provider_type: "{{ provider_type }}"
        access_zone: "{{ access_zone }}"
        group_name: "{{ group_name }}"
        state: "present"

    - name: Add a child group to a parent group
      dellemc.powerscale.group:
        onefs_host: "{{ onefs_host }}"
        api_user: "{{ api_user }}"
        api_password: "{{ api_password }}"
        verify_ssl: "{{ verify_ssl }}"
        provider_type: "local"
        access_zone: "{{ access_zone }}"
        group_name: "{{ group_name }}"
        group_members:
          - group_name: "{{ empty_group_name }}"
        group_member_state: "present-in-group"
        state: "present"

    - name: Add a child group - Idempotency check
      dellemc.powerscale.group:
        onefs_host: "{{ onefs_host }}"
        api_user: "{{ api_user }}"
        api_password: "{{ api_password }}"
        verify_ssl: "{{ verify_ssl }}"
        provider_type: "local"
        access_zone: "{{ access_zone }}"
        group_name: "{{ group_name }}"
        group_members:
          - group_name: "{{ empty_group_name }}"
        group_member_state: "present-in-group"
        state: "present"

    - name: Add child groups from different providers
      dellemc.powerscale.group:
        onefs_host: "{{ onefs_host }}"
        api_user: "{{ api_user }}"
        api_password: "{{ api_password }}"
        verify_ssl: "{{ verify_ssl }}"
        provider_type: "local"
        access_zone: "{{ access_zone }}"
        group_name: "{{ group_name }}"
        group_members:
          - group_name: "{{ empty_group_name }}"
            provider_type: "local"
          - group_name: "{{ ldap_group_name }}"
            provider_type: "ldap"
        group_member_state: "present-in-group"
        state: "present"
      when: ldap_group_name is defined

    - name: Remove a child group from a parent group
      dellemc.powerscale.group:
        onefs_host: "{{ onefs_host }}"
        api_user: "{{ api_user }}"
        api_password: "{{ api_password }}"
        verify_ssl: "{{ verify_ssl }}"
        provider_type: "local"
        access_zone: "{{ access_zone }}"
        group_name: "{{ group_name }}"
        group_members:
          - group_name: "{{ empty_group_name }}"
        group_member_state: "absent-in-group"
        state: "present"

    - name: Remove a child group - Idempotency check
      dellemc.powerscale.group:
        onefs_host: "{{ onefs_host }}"
        api_user: "{{ api_user }}"
        api_password: "{{ api_password }}"
        verify_ssl: "{{ verify_ssl }}"
        provider_type: "local"
        access_zone: "{{ access_zone }}"
        group_name: "{{ group_name }}"
        group_members:
          - group_name: "{{ empty_group_name }}"
        group_member_state: "absent-in-group"
        state: "present"

    # ----------------------------------------------------------------
    # Well-known SID membership tasks (well_known_sids parameter)
    # ----------------------------------------------------------------

    - name: Add a well-known SID to a group by display name
      dellemc.powerscale.group:
        onefs_host: "{{ onefs_host }}"
        api_user: "{{ api_user }}"
        api_password: "{{ api_password }}"
        verify_ssl: "{{ verify_ssl }}"
        provider_type: "local"
        access_zone: "{{ access_zone }}"
        group_name: "{{ group_name }}"
        well_known_sids:
          - "Everyone"
        well_known_sid_state: "present-in-group"
        state: "present"

    - name: Add a well-known SID - Idempotency check
      dellemc.powerscale.group:
        onefs_host: "{{ onefs_host }}"
        api_user: "{{ api_user }}"
        api_password: "{{ api_password }}"
        verify_ssl: "{{ verify_ssl }}"
        provider_type: "local"
        access_zone: "{{ access_zone }}"
        group_name: "{{ group_name }}"
        well_known_sids:
          - "Everyone"
        well_known_sid_state: "present-in-group"
        state: "present"

    - name: Add multiple well-known SIDs in one task
      dellemc.powerscale.group:
        onefs_host: "{{ onefs_host }}"
        api_user: "{{ api_user }}"
        api_password: "{{ api_password }}"
        verify_ssl: "{{ verify_ssl }}"
        provider_type: "local"
        access_zone: "{{ access_zone }}"
        group_name: "{{ group_name }}"
        well_known_sids:
          - "Everyone"
          - "Authenticated Users"
        well_known_sid_state: "present-in-group"
        state: "present"

    - name: Add a well-known SID by SID string
      dellemc.powerscale.group:
        onefs_host: "{{ onefs_host }}"
        api_user: "{{ api_user }}"
        api_password: "{{ api_password }}"
        verify_ssl: "{{ verify_ssl }}"
        provider_type: "local"
        access_zone: "{{ access_zone }}"
        group_name: "{{ group_name }}"
        well_known_sids:
          - "S-1-1-0"
        well_known_sid_state: "present-in-group"
        state: "present"

    - name: Remove a well-known SID from a group
      dellemc.powerscale.group:
        onefs_host: "{{ onefs_host }}"
        api_user: "{{ api_user }}"
        api_password: "{{ api_password }}"
        verify_ssl: "{{ verify_ssl }}"
        provider_type: "local"
        access_zone: "{{ access_zone }}"
        group_name: "{{ group_name }}"
        well_known_sids:
          - "Everyone"
        well_known_sid_state: "absent-in-group"
        state: "present"

    - name: Remove a well-known SID - Idempotency check
      dellemc.powerscale.group:
        onefs_host: "{{ onefs_host }}"
        api_user: "{{ api_user }}"
        api_password: "{{ api_password }}"
        verify_ssl: "{{ verify_ssl }}"
        provider_type: "local"
        access_zone: "{{ access_zone }}"
        group_name: "{{ group_name }}"
        well_known_sids:
          - "Everyone"
        well_known_sid_state: "absent-in-group"
        state: "present"

    # ----------------------------------------------------------------
    # Mixed member types in a single task
    # ----------------------------------------------------------------

    - name: Add users, child groups, and well-known SIDs in a single task
      dellemc.powerscale.group:
        onefs_host: "{{ onefs_host }}"
        api_user: "{{ api_user }}"
        api_password: "{{ api_password }}"
        verify_ssl: "{{ verify_ssl }}"
        provider_type: "local"
        access_zone: "{{ access_zone }}"
        group_name: "{{ group_name }}"
        users:
          - user_name: "{{ user_name_1 }}"
        user_state: "present-in-group"
        group_members:
          - group_name: "{{ empty_group_name }}"
        group_member_state: "present-in-group"
        well_known_sids:
          - "Everyone"
        well_known_sid_state: "present-in-group"
        state: "present"

    - name: Check mode with diff - preview child group and SID changes
      dellemc.powerscale.group:
        onefs_host: "{{ onefs_host }}"
        api_user: "{{ api_user }}"
        api_password: "{{ api_password }}"
        verify_ssl: "{{ verify_ssl }}"
        provider_type: "local"
        access_zone: "{{ access_zone }}"
        group_name: "{{ group_name }}"
        group_members:
          - group_name: "{{ empty_group_name }}"
        group_member_state: "absent-in-group"
        well_known_sids:
          - "Everyone"
        well_known_sid_state: "absent-in-group"
        state: "present"
      check_mode: true
      diff: true
      register: result

    - name: Display diff output for mixed removals
      ansible.builtin.debug:
        var: result.diff

    - name: Cleanup child group and SID test group
      dellemc.powerscale.group:
        onefs_host: "{{ onefs_host }}"
        api_user: "{{ api_user }}"
        api_password: "{{ api_password }}"
        verify_ssl: "{{ verify_ssl }}"
        provider_type: "{{ provider_type }}"
        access_zone: "{{ access_zone }}"
        group_name: "{{ group_name }}"
        state: "absent"

    # ----------------------------------------------------------------
    # End child group and well-known SID tasks
    # ----------------------------------------------------------------

    - name: Get LDAP Group Details using group name in System Access Zone
      dellemc.powerscale.group:
        onefs_host: "{{ onefs_host }}"
        port_no: "{{ port_no }}"
        api_user: "{{ api_user }}"
        api_password: "{{ api_password }}"
        verify_ssl: "{{ verify_ssl }}"
        provider_type: "ldap"
        access_zone: "{{ access_zone }}"
        group_name: "{{ ldap_group_name }}"
        state: "present"

    - name: Get AD group Details using group name in System Access Zone
      dellemc.powerscale.group:
        onefs_host: "{{ onefs_host }}"
        port_no: "{{ port_no }}"
        api_user: "{{ api_user }}"
        api_password: "{{ api_password }}"
        verify_ssl: "{{ verify_ssl }}"
        provider_type: "ads"
        access_zone: "{{ access_zone }}"
        group_name: "{{ ads_group_name | default('DOMAIN\\\\ad_group') }}"
        state: "present"
      when: ads_group_name is defined

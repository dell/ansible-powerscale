---
# Example: Multi-trustee ACL with object_inherit + no_prop_inherit
#
# This playbook demonstrates configuring ACEs for multiple trustees using
# object_inherit + no_prop_inherit, which propagates permissions only to
# immediate child files (not to deeper descendants).
#
# Use case: An administrator needs to grant different access levels to
# immediate child files only — admin gets full control and a restricted user
# gets read-only access, both limited to first-level files only.
#
# NOTE: The OneFS REST API consolidates multiple ACEs for the same trustee
# with the same access_type into a single ACE. Use different trustees or
# different access_type values (allow + deny) to maintain separate ACEs.

- name: Multi-trustee ACL with object_inherit + no_prop_inherit
  hosts: localhost
  connection: local
  vars:
    onefs_host: '10.**.**.**'
    verify_ssl: false
    api_user: 'root'
    api_password: '**********'
    test_path: '/ifs/multi_ace_object_no_prop_test'
    admin_user: 'ansible_test_user1'
    read_user: 'ansible_test_user2'
    trustee_provider: 'ldap'

  tasks:
    - name: Create filesystem for object_inherit + no_prop_inherit test
      dellemc.powerscale.filesystem:
        onefs_host: "{{ onefs_host }}"
        verify_ssl: "{{ verify_ssl }}"
        api_user: "{{ api_user }}"
        api_password: "{{ api_password }}"
        path: "{{ test_path }}"
        owner:
          name: "{{ admin_user }}"
          provider_type: "{{ trustee_provider }}"
        state: present

    - name: Set ACEs for two trustees with no_prop_inherit
      dellemc.powerscale.filesystem:
        onefs_host: "{{ onefs_host }}"
        verify_ssl: "{{ verify_ssl }}"
        api_user: "{{ api_user }}"
        api_password: "{{ api_password }}"
        path: "{{ test_path }}"
        access_control_rights:
          # Admin: full control on immediate child files only
          - access_type: "allow"
            access_rights:
              - "dir_gen_all"
            inherit_flags:
              - "object_inherit"
              - "no_prop_inherit"
            trustee:
              name: "{{ admin_user }}"
              provider_type: "{{ trustee_provider }}"
          # Read user: read access on immediate child files only
          - access_type: "allow"
            access_rights:
              - "dir_gen_read"
            inherit_flags:
              - "object_inherit"
              - "no_prop_inherit"
            trustee:
              name: "{{ read_user }}"
              provider_type: "{{ trustee_provider }}"
        access_control_rights_state: "replace"
        state: present

    - name: Set ACEs with no_prop_inherit - Idempotency check
      dellemc.powerscale.filesystem:
        onefs_host: "{{ onefs_host }}"
        verify_ssl: "{{ verify_ssl }}"
        api_user: "{{ api_user }}"
        api_password: "{{ api_password }}"
        path: "{{ test_path }}"
        access_control_rights:
          - access_type: "allow"
            access_rights:
              - "dir_gen_all"
            inherit_flags:
              - "object_inherit"
              - "no_prop_inherit"
            trustee:
              name: "{{ admin_user }}"
              provider_type: "{{ trustee_provider }}"
          - access_type: "allow"
            access_rights:
              - "dir_gen_read"
            inherit_flags:
              - "object_inherit"
              - "no_prop_inherit"
            trustee:
              name: "{{ read_user }}"
              provider_type: "{{ trustee_provider }}"
        access_control_rights_state: "replace"
        state: present
      register: result_idempotent

    - name: Verify idempotency (no changes expected)
      ansible.builtin.assert:
        that:
          - not result_idempotent.changed
        fail_msg: "Idempotency check failed - unexpected change detected"

    - name: Clean up - delete test filesystem
      dellemc.powerscale.filesystem:
        onefs_host: "{{ onefs_host }}"
        verify_ssl: "{{ verify_ssl }}"
        api_user: "{{ api_user }}"
        api_password: "{{ api_password }}"
        path: "{{ test_path }}"
        recursive_force_delete: true
        state: absent

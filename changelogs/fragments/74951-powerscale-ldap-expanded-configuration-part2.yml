  - dellemc.powerscale.ldap - Added EXAMPLES for separate group hierarchy, identity-only provider, multi-domain qualification, and check-mode/diff preview.
  - dellemc.powerscale.ldap - Extended example playbook (``playbooks/modules/ldap.yml``) with end-to-end tasks exercising all new parameters, clearing, idempotency, and check/diff mode.

---
minor_changes:
  - user - Added ``password_expires`` (bool) parameter to enable or disable
    password expiration enforcement for local users
    (`#217 <https://github.com/dell/ansible-powerscale/issues/217>`__).
  - user - Added ``expiry`` (int, Unix epoch) parameter to set or clear
    account expiration for local users
    (`#217 <https://github.com/dell/ansible-powerscale/issues/217>`__).
  - user - Enabled check mode (``supports_check_mode=True``) with diff
    output for ``password_expires`` and ``expiry`` changes.
  - user - Added read-only output fields ``expired``, ``password_expired``,
    ``password_expiry``, and ``max_password_age`` to ``user_details``.

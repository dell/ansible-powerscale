---
minor_changes:
  - dellemc.powerscale.group - Added cross-provider group membership support.
    Users from different authentication providers (LDAP, AD, NIS, file) can
    now be added to or removed from a local group by specifying a per-member
    ``provider_type`` in the ``users`` list. The module validates provider
    existence and OneFS version (>= 9.11.0) before issuing API calls. Legacy
    playbooks that omit the per-member ``provider_type`` continue to work
    unchanged. Added ``check_mode`` and ``diff_mode`` support for membership
    operations. Documentation updated with suboptions, attributes block, and
    cross-provider examples.

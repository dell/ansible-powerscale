---
minor_changes:
  - user - Added runtime ``isi_sdk`` compatibility gate that verifies
    ``AuthUser`` exposes ``password_expires`` and ``expiry`` attributes
    via ``hasattr()`` before applying either parameter. Fails with a
    clear unsupported-version message on SDK models lacking the
    attributes (OneFS versions prior to 9.13.x)
    (`#217 <https://github.com/dell/ansible-powerscale/issues/217>`__).

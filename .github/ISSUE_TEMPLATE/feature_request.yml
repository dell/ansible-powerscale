name: 🚀 PowerScale Ansible Feature Request
description: Suggest an enhancement for Dell PowerScale Ansible Modules
title: "[FEATURE]: "
labels: ["type/feature-request", "needs-triage", "ansible"]
body:
  - type: input
    id: title
    attributes:
      label: Title
      description: "[FEATURE]: prefix is required and cannot be removed"
      value: "[FEATURE]: "
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature enhancement for Dell PowerScale Ansible Modules!
        
        ## Community Note
        * Please vote on this issue by adding a 👍 [reaction](https://blog.github.com/2016-03-10-add-reactions-to-pull-requests-issues-and-comments/) to help prioritize this request
        * Please do not leave "+1" or other comments that do not add relevant new information or questions
        * If you are interested in working on this issue or have submitted a pull request, please leave a comment

  - type: input
    id: module-name
    attributes:
      label: Module Name (if applicable)
      description: Enter the specific PowerScale module name this relates to (e.g., powerscale_filesystem, powerscale_nfs, powerscale_user)
      placeholder: "powerscale_filesystem"
    validations:
      required: false

  - type: dropdown
    id: request-type
    attributes:
      label: Request Type
      description: What type of enhancement are you requesting?
      options:
        - New Module
        - New Module Parameter
        - Module Enhancement
        - Documentation Improvement
        - Performance Improvement
        - Error Handling Improvement
        - Integration Enhancement
        - Other (specify in description)
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Customer Details

  - type: input
    id: organization-name
    attributes:
      label: Organization Name
      placeholder: Example Corp
    validations:
      required: true

  - type: input
    id: industry
    attributes:
      label: Industry
      placeholder: Financial Services, Healthcare, Telecom, etc.
    validations:
      required: true

  - type: input
    id: customer-size
    attributes:
      label: Size
      placeholder: Number of users, clusters, storage capacity, etc.
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Your Context

  - type: input
    id: role
    attributes:
      label: Role
      placeholder: Storage Administrator, DevOps Engineer, Architect, etc.
    validations:
      required: true

  - type: input
    id: scale
    attributes:
      label: Scale (# of devices/operations affected)
      placeholder: e.g. 500 nodes, 1000 daily operations
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: How often do you encounter this?
      options:
        - Daily
        - Weekly
        - Monthly
        - Quarterly
        - Occasionally
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Business Impact

  - type: textarea
    id: time-savings
    attributes:
      label: Time savings per operation
      description: Estimate the amount of time saved if this feature exists.
    validations:
      required: true

  - type: textarea
    id: error-reduction
    attributes:
      label: Expected error reduction
      description: Describe how this enhancement would reduce operational errors.
    validations:
      required: true

  - type: textarea
    id: compliance-security
    attributes:
      label: Compliance / Security Requirements
      description: Describe any regulatory, audit, or security requirements driving this request.
    validations:
      required: true

  - type: textarea
    id: other-business-impact
    attributes:
      label: Other Business Impacts
      description: Cost savings, faster deployment, customer satisfaction, operational efficiency, etc.
    validations:
      required: false

  - type: textarea
    id: current-workaround
    attributes:
      label: Current Workaround
      description: How are you handling this today?
    validations:
      required: true


  - type: textarea
    id: problem-statement
    attributes:
      label: Problem Statement
      description: What problem are you trying to solve with this feature request?
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: A clear and concise description of what you want to happen
    validations:
      required: true

  - type: textarea
    id: ansible-use-case
    attributes:
      label: Ansible Use Case
      description: |
        Describe how this feature would be used in Ansible automation.
        Include example playbook or task if possible.
        
        Example:
        ```yaml
        - name: Proposed new PowerScale functionality
          dell.powerscale.powerscale_new_module:
            name: "example_resource"
            access_zone: "System"
            api_host: "{{ powerscale_host }}"
            api_user: "{{ powerscale_user }}"
            api_password: "{{ powerscale_password }}"
            validate_certs: false
        ```
      render: markdown
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions Considered
      description: A clear and concise description of any alternative solutions or workarounds you've considered
    validations:
      required: false

  - type: textarea
    id: api-considerations
    attributes:
      label: API/Backend Considerations
      description: |
        If this feature involves API calls, describe:
        - Relevant API endpoints (if known)
        - API version requirements
        - Authentication considerations
        - Rate limiting or performance concerns
    validations:
      required: false

  - type: dropdown
    id: contribution-interest
    attributes:
      label: Contribution Interest
      description: Would you be interested in contributing to this feature?
      options:
        - Yes, I can implement this feature
        - Yes, I can help with testing
        - Yes, I can help with documentation
        - No, but I can provide guidance
        - No contribution interest at this time
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any other context, screenshots, or examples about the feature request
    validations:
      required: false
